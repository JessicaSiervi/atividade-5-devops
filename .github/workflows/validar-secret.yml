name: Teste da Chave Mestra

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  testar-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar Secret
        run: |
          echo "Verificando a chave mestra..."
          echo "Valor recebido: $CHAVE_MESTRA"
          echo "Teste concluido!"
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
